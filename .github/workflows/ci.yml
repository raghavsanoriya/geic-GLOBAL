name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancelling a PR build is safe. Once a branch push starts a remote cPanel
  # release, let it finish so a second deployment cannot overlap it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run application tests
        run: php artisan test --compact

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify compiled assets are committed
        run: |
          if [[ -n "$(git status --porcelain -- public/build)" ]]; then
            echo "Frontend assets are stale. Run npm run build and commit public/build." >&2
            git status --short -- public/build
            exit 1
          fi

  ui:
    name: UI functional verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/ui-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
      - name: Set up Python browser runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run UI interaction and verification smoke tests
        run: python scripts/ui_smoke.py
      - name: Upload UI server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-server-log
          path: storage/logs/ui-server.log

  mobile:
    name: Expo Go mobile verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Expo dependencies
        working-directory: mobile
        run: npm ci
      - name: Type-check Expo app
        working-directory: mobile
        run: npm run test:typecheck
      - name: Verify Expo web bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir .expo-ci-export

  deploy:
    name: Release after verification
    needs: [test, frontend, ui, mobile]
    # Production/staging releases must be started explicitly from the
    # controlled workflow_dispatch workflow. Never deploy as a side effect of
    # pushing to main or develop.
    if: ${{ false }}
    uses: ./.github/workflows/release.yml
    with:
      target: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      source_branch: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
    secrets: inherit
