name: Reusable cPanel release

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target }}
    concurrency:
      group: cpanel-${{ inputs.target }}
      cancel-in-progress: false

    steps:
      - name: Validate release target
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          case "$TARGET:$SOURCE_BRANCH" in
            staging:develop|production:main) ;;
            *)
              echo "Refusing $TARGET deployment from $SOURCE_BRANCH." >&2
              exit 64
              ;;
          esac

      - name: Update cPanel repository from GitHub
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ vars.CPANEL_REPOSITORY_ROOT }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            --get \
            --data-urlencode "repository_root=$CPANEL_REPOSITORY_ROOT" \
            --data-urlencode "branch=$SOURCE_BRANCH" \
            --data-urlencode 'source_repository={"remote_name":"origin"}' \
            "https://$CPANEL_HOST:2083/execute/VersionControl/update")

          status=$(jq -r '.result.status // .status // 0' <<< "$response")
          if [[ "$status" != "1" ]]; then
            jq . <<< "$response"
            exit 1
          fi

      - name: Ask cPanel to deploy the verified commit
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ vars.CPANEL_REPOSITORY_ROOT }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            --get \
            --data-urlencode "repository_root=$CPANEL_REPOSITORY_ROOT" \
            "https://$CPANEL_HOST:2083/execute/VersionControlDeployment/create")

          status=$(jq -r '.result.status // .status // 0' <<< "$response")
          if [[ "$status" != "1" ]]; then
            jq . <<< "$response"
            exit 1
          fi

      - name: Verify exact release and public routes
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          base_url="${APP_URL%/}"
          deployed_sha=""

          for attempt in {1..60}; do
            deployed_sha=$(curl --fail --silent --show-error \
              --retry 1 --retry-all-errors \
              "$base_url/release.txt" || true)

            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              echo "Release $EXPECTED_SHA is active."
              break
            fi

            if (( attempt % 10 == 0 )); then
              echo "Waiting for cPanel activation ($attempt/60). Current release: ${deployed_sha:-unavailable}"
            fi
            sleep 2
          done

          if [[ "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but production reports ${deployed_sha:-nothing}." >&2
            exit 1
          fi

          printf '%s\n' \
            /up \
            / \
            /pages/about \
            /pages/terms \
            /events \
            /destinations \
            /destinations/australia \
            /services \
            /scholarships \
            /tests \
            /contact \
            /admin/login \
            /assets/design_1/css/app.min.css \
            | xargs -P 4 -I '{}' bash -c '
                curl --fail --silent --show-error --output /dev/null \
                  --retry 2 --retry-delay 1 --retry-all-errors \
                  "$1$2"
              ' _ "$base_url" '{}'

          echo "All production smoke checks passed."
