name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  redeploy:
    name: Controlled redeployment
    uses: ./.github/workflows/release.yml
    with:
      target: ${{ inputs.target }}
      source_branch: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
    secrets: inherit
