name: GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assemble static preview
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/website site/landing-preview
          cp -R landing-page/. site/landing-preview/
          cp -R preview/full-site/. site/website/
          cp -R public/assets site/website/assets
          cp -R public/store site/website/store
          cp preview/index.html site/index.html
          cp preview/preview.css site/preview.css
          cp preview/dashboard.html site/dashboard.html
          cp preview/dashboard.css site/dashboard.css
          cp preview/admin-login.html site/admin-login.html
          cp preview/admin-login.css site/admin-login.css
          cp preview/.nojekyll site/.nojekyll
          python - <<'PY'
          from pathlib import Path

          # The landing page is also used by Laravel at /landing. Rewrite its
          # asset URLs for the repository-relative GitHub Pages deployment.
          for path in (Path('site/landing-preview/index.html'), Path('site/landing-preview/script.js'), Path('site/landing-preview/styles.css')):
              text = path.read_text(encoding='utf-8')
              text = text.replace('/landing/', './')
              path.write_text(text, encoding='utf-8')

          route_files = {
              '/': 'index.html', '/destinations': 'destinations.html', '/services': 'services.html',
              '/events': 'events.html', '/scholarships': 'scholarships.html', '/tests': 'tests.html',
              '/contact': 'contact.html', '/compare-destinations': 'compare-destinations.html',
              '/emi-calculator': 'emi-calculator.html', '/education-loans': 'education-loans.html',
              '/study-planner': 'study-planner.html', '/ai-agents': 'ai-agents.html',
              '/destinations/australia': 'destinations-australia.html', '/destinations/canada': 'destinations-canada.html',
              '/destinations/dubai': 'destinations-dubai.html', '/destinations/europe': 'destinations-europe.html',
              '/destinations/germany': 'destinations-germany.html', '/destinations/ireland': 'destinations-ireland.html',
              '/destinations/malaysia': 'destinations-malaysia.html', '/destinations/new-zealand': 'destinations-new-zealand.html',
              '/destinations/singapore': 'destinations-singapore.html', '/destinations/switzerland': 'destinations-switzerland.html',
              '/destinations/uk': 'destinations-uk.html', '/destinations/usa': 'destinations-usa.html',
              '/pages/about': 'pages-about.html', '/pages/terms': 'pages-terms.html',
          }
          app = Path('site/website')
          for path in app.glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('<base href="/">', '<base href="./">')
              text = text.replace('http://127.0.0.1:8099', '.')
              text = text.replace('https://127.0.0.1:8099', '.')
              text = text.replace('href="/assets/', 'href="assets/')
              text = text.replace('src="/assets/', 'src="assets/')
              text = text.replace('href="/store/', 'href="store/')
              text = text.replace('src="/store/', 'src="store/')
              for route, filename in sorted(route_files.items(), key=lambda item: len(item[0]), reverse=True):
                  text = text.replace(f'href="{route}"', f'href="{filename}"')
                  text = text.replace(f'href="{route}#', f'href="{filename}#')
                  text = text.replace(f'href=".{route}"', f'href="{filename}"')
                  text = text.replace(f'href=".{route}#', f'href="{filename}#')
              path.write_text(text, encoding='utf-8')

          page = Path('site/website/index.html')
          text = page.read_text(encoding='utf-8')
          banner = '''<a href="../dashboard.html" style="position:fixed;z-index:9999;right:18px;bottom:18px;background:#eb1c2a;color:#fff;border-radius:999px;padding:11px 16px;font:700 12px/1.2 'Plus Jakarta Sans',sans-serif;text-decoration:none;box-shadow:0 8px 24px rgba(16,29,66,.2)">Dashboard preview ↗</a>'''
          text = text.replace('</body>', banner + '</body>')
          page.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
