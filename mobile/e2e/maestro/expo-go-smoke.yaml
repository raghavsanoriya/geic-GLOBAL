# AUITestAgent-inspired interaction → verification flow for Expo Go.
# Run after starting the app with: npx expo start --go
appId: host.exp.exponent

---
- launchApp
- assertVisible: "Good morning, Sarfaraz"
- assertVisible: "Jump back in"
- assertVisible: "Compare destinations"
- tapOn: "EMI calculator"
- assertVisible: "Service guide"
- tapOn: "Go back"

- tapOn: "Explore tab"
- assertVisible: "Find your place"
- tapOn: "Search destinations, tools or guides"
- inputText: "Australia"
- hideKeyboard
- assertVisible: "Australia"
- tapOn: "Open Australia destination"
- assertVisible: "Destination guide"
- tapOn: "Go back"

- tapOn: "Events tab"
- assertVisible: "Events that move"
- tapOn: "Open Global Uni Expo"
- assertVisible: "Event details"
- tapOn: "Reserve my place"
- assertVisible: "Your place is reserved locally"
- tapOn: "Go back"

- tapOn: "Services tab"
- assertVisible: "Support for your"
- tapOn: "Open Destination planning"
- assertVisible: "Service guide"
- tapOn: "Go back"

- tapOn: "Apply tab"
- assertVisible: "Your plan starts"
- tapOn: "Submit counselling request"
- assertVisible: "Please complete every field"
