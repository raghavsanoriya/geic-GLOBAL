# AUITestAgent-inspired interaction → verification flow for Expo Go.
# Run after starting the app with: npx expo start --go
appId: host.exp.exponent

---
- launchApp
- assertVisible: "Shape your future"
- assertVisible: "Book free counselling"
- tapOn: "Book free counselling"
- assertVisible: "We will connect you with a counsellor"

- tapOn: "Explore tab"
- assertVisible: "EXPLORE WITH PURPOSE"
- tapOn: "Find your next study destination"
- inputText: "Australia"
- hideKeyboard
- assertVisible: "Australia"
- tapOn: "Explore Australia"
- assertVisible: "Australia destination guide opened"

- tapOn: "Services tab"
- assertVisible: "Support for your"
- tapOn: "Destination planning"
- assertVisible: "Destination planning opened"

- tapOn: "Apply tab"
- assertVisible: "Your plan starts"
- tapOn: "Submit counselling request"
- assertVisible: "Please complete the three fields"
