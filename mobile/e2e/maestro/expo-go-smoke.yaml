# Native Expo Go smoke flow for the GEIC mobile experience.
# Run after starting the app with: npx expo start --go
appId: host.exp.exponent

---
- launchApp
- assertVisible: "Make your next decision easier"
- assertVisible: "Explore countries"
- assertVisible: "Home tab"

- tapOn: "Explore tab"
- assertVisible: "Find your place"
- tapOn: "Search destinations"
- inputText: "Australia"
- hideKeyboard
- tapOn: "Open Australia destination"
- assertVisible: "Plan with verified guidance"
- tapOn: "Go back"

- tapOn: "AI Advisor tab"
- assertVisible: "Ask your next question"
- assertVisible: "Message the AI Advisor"

- tapOn: "Evaluate tab"
- assertVisible: "See what to strengthen next"
- tapOn: "Evaluate my profile"
- assertVisible: "Choose at least one destination"
- tapOn: "Australia"
- tapOn: "Valid passport"
- assertVisible: "1 of 6 ready"

- tapOn: "More tab"
- assertVisible: "Everything for your journey"
- tapOn: "Open Expert Counselling"
- assertVisible: "What this helps you achieve"
- tapOn: "Go back"
- tapOn: "Send my enquiry"
- tapOn: "Submit counselling request"
- assertVisible: "Please check the highlighted fields"
